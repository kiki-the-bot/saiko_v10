<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAIKO // NEURAL INTERFACE</title>

    <style>
        /* 1. RESET: Kill default browser styles */
        body {
            background-color: #050505; /* Pitch black */
            color: #00ff41;            /* Matrix Green */
            font-family: 'Courier New', monospace; /* Hacker Font */
            margin: 0;
            height: 100vh;             /* Full screen height */
            display: flex;             /* Flexbox: The Layout God */
            flex-direction: column;    /* Stack items vertically */
            align-items: center;       /* Center everything horizontally */
            justify-content: center;   /* Center everything vertically */
            overflow: hidden;          /* No scrollbars on body */
        }

        /* 2. THE TERMINAL WINDOW */
        #terminal-container {
            width: 80%;
            height: 60%;
            border: 2px solid #00ff41; /* Green Border */
            background: rgba(0, 20, 0, 0.9); /* Semi-transparent black */
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2); /* Green Glow */
            padding: 20px;
            overflow-y: auto;          /* Scroll if text gets too long */
            margin-bottom: 20px;
            position: relative;        /* For z-index stacking */
            z-index: 10;
        }

        /* 3. MESSAGES (User vs Saiko) */
        .msg { 
            margin-bottom: 12px; 
            line-height: 1.4;
        }
        .user-msg { color: #00ccff; } /* Blue for you */
        .saiko-msg { color: #00ff41; font-weight: bold; } /* Green for AI */
        
        /* 4. THE BUTTON */
        #talk-btn {
            background: transparent;
            border: 2px solid #00ff41;
            color: #00ff41;
            padding: 15px 40px;
            font-size: 1.2rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: all 0.3s ease; /* Smooth animation */
            z-index: 10;
        }

        /* Hover Effect: The "Glitch" look */
        #talk-btn:hover {
            background: #00ff41;
            color: black;
            box-shadow: 0 0 25px #00ff41;
        }

        #talk-btn:active {
            transform: scale(0.95); /* Shrink slightly when clicked */
        }

        /* 5. CRT SCANLINE EFFECT (The Retro Look) */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.1) 50%
            );
            background-size: 100% 4px; /* The stripes */
            pointer-events: none; /* Let clicks pass through */
            z-index: 5;
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>

    <div id="terminal-container">
        <div class="msg saiko-msg">SAIKO_SYS v2.4 [ONLINE]</div>
        <div class="msg saiko-msg">WAITING FOR AUDIO INPUT...</div>
        </div>

    <button id="talk-btn">INITIATE LINK</button>
    <div style="margin-top: 10px; color: #555;" id="status-text">SYSTEM IDLE</div>


    <script>
        // --- 1. CONFIGURATION ---
        // Using relative path so it works locally and in production
        const API_ENDPOINT = "/chat"; 

        // --- 2. GETTING HTML ELEMENTS ---
        const terminal = document.getElementById('terminal-container');
        const btn = document.getElementById('talk-btn');
        const status = document.getElementById('status-text');

        // --- 3. BROWSER APIs (The Ears and Mouth) ---
        // Speech Recognition (Ears)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US'; 
        
        // Speech Synthesis (Mouth)
        const synth = window.speechSynthesis;

        // --- 4. HELPER FUNCTIONS ---
        
        // Function to print text to our screen
        function logToTerminal(text, sender) {
            const div = document.createElement('div');
            // Add classes based on who is speaking
            div.className = `msg ${sender === 'user' ? 'user-msg' : 'saiko-msg'}`;
            div.innerText = `[${sender.toUpperCase()}]: ${text}`;
            
            terminal.appendChild(div);
            // Auto-scroll to the bottom
            terminal.scrollTop = terminal.scrollHeight;
        }

        // Function to make the browser speak
        function speak(text) {
            if (synth.speaking) synth.cancel(); // Stop if already talking
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.pitch = 0.9; 
            utterance.rate = 1.0;
            synth.speak(utterance);
        }

        // --- 5. THE CORE LOGIC (Talking to Python) ---
        async function talkToSaiko(userText) {
            status.innerText = "UPLOADING TO NEURAL NET...";
            
            try {
                // THE FETCH: This is the actual API call
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        prompt: userText, 
                        role: "user" 
                    })
                });

                const data = await response.json();
                
                // If Python sends back a response
                if (data.response) {
                    logToTerminal(data.response, 'saiko');
                    speak(data.response);
                    status.innerText = "SYSTEM IDLE";
                }

            } catch (error) {
                logToTerminal("ERROR: CONNECTION SEVERED", 'saiko');
                status.innerText = "OFFLINE";
                console.error(error);
            }
        }

        // --- 6. EVENT LISTENERS (Triggers) ---
        
        // When user clicks the button
        btn.onclick = () => {
            recognition.start(); // Turn on microphone
            status.innerText = "LISTENING...";
            btn.style.borderColor = "#ff0000"; // Red border
            btn.innerText = "RECORDING";
        };

        // When the browser hears speech
        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            logToTerminal(transcript, 'user');
            talkToSaiko(transcript); // Send to Python!
        };

        // When the microphone turns off
        recognition.onend = () => {
            btn.style.borderColor = "#00ff41"; // Green border
            btn.innerText = "INITIATE LINK";
        };

    </script>
</body>
</html>
